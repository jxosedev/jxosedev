name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate stats cards
        env:
          GH_TOKEN: ${{ secrets.STATS_PAT }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          STATS=$(gh api graphql -f query='
            query($login: String!) {
              user(login: $login) {
                name
                repositories(ownerAffiliations: OWNER, first: 100, isFork: false) {
                  nodes {
                    name
                    isPrivate
                    stargazerCount
                    pullRequests { totalCount }
                    issues { totalCount }
                  }
                }
                contributionsCollection {
                  contributionCalendar { totalContributions }
                }
              }
            }
          ' -f login="$USERNAME" --jq '.data.user')

          USER_NAME=$(echo "$STATS" | jq -r '.name // empty')
          if [ -z "$USER_NAME" ]; then USER_NAME="$USERNAME"; fi

          TOTAL_CONTRIBUTIONS=$(echo "$STATS" | jq -r '.contributionsCollection.contributionCalendar.totalContributions')
          TOTAL_STARS=$(echo "$STATS" | jq -r '[.repositories.nodes[].stargazerCount] | add // 0')
          TOTAL_PRS=$(echo "$STATS" | jq -r '[.repositories.nodes[].pullRequests.totalCount] | add // 0')
          TOTAL_ISSUES=$(echo "$STATS" | jq -r '[.repositories.nodes[].issues.totalCount] | add // 0')

          RANK="C"
          if [ "$TOTAL_CONTRIBUTIONS" -gt 500 ]; then RANK="A+"
          elif [ "$TOTAL_CONTRIBUTIONS" -gt 300 ]; then RANK="B+"
          elif [ "$TOTAL_CONTRIBUTIONS" -gt 200 ]; then RANK="B"
          elif [ "$TOTAL_CONTRIBUTIONS" -gt 100 ]; then RANK="C+"
          fi

          cat > profile/stats.svg << SVGEOF
          <svg width="467" height="195" viewBox="0 0 467 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="descId">
            <title id="titleId">${USER_NAME}'s GitHub Stats, Rank: ${RANK}</title>
            <style>
              .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #ffffff; animation: fadeInAnimation 0.8s ease-in-out forwards; }
              @supports(-moz-appearance: auto) { .header { font-size: 15.5px; } }
              .stat { font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #ffffff; }
              @supports(-moz-appearance: auto) { .stat { font-size: 12px; } }
              .bold { font-weight: 700 }
              .stagger { opacity: 0; animation: fadeInAnimation 0.3s ease-in-out forwards; }
              .rank-text { font: 800 24px 'Segoe UI', Ubuntu, Sans-Serif; fill: #ffffff; animation: scaleInAnimation 0.3s ease-in-out forwards; }
              .rank-circle-rim { stroke: #ffffff; fill: none; stroke-width: 6; opacity: 0.2; }
              .rank-circle { stroke: #ffffff; stroke-dasharray: 250; fill: none; stroke-width: 6; stroke-linecap: round; opacity: 0.8; transform-origin: -10px 8px; transform: rotate(-90deg); }
              @keyframes scaleInAnimation { from { transform: translate(-5px, 5px) scale(0); } to { transform: translate(-5px, 5px) scale(1); } }
              @keyframes fadeInAnimation { from { opacity: 0; } to { opacity: 1; } }
            </style>
            <rect x="0.5" y="0.5" width="466" height="99%" rx="4.5" fill="#0a0a0a" stroke="#e4e2e2"/>
            <g transform="translate(25, 35)">
              <text x="0" y="0" class="header">${USER_NAME}'s GitHub Stats</text>
            </g>
            <g transform="translate(390.5, 52.5)">
              <circle class="rank-circle-rim" cx="-10" cy="8" r="40"/>
              <circle class="rank-circle" cx="-10" cy="8" r="40"/>
              <text x="-5" y="3" alignment-baseline="central" dominant-baseline="central" text-anchor="middle" class="rank-text">${RANK}</text>
            </g>
            <g transform="translate(25, 55)">
              <g class="stagger" style="animation-delay: 450ms">
                <svg viewBox="0 0 16 16" width="16" height="16" style="display:block"><path fill="#ffffff" d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25zm0 2.445L6.615 5.5a.75.75 0 01-.564.41l-3.097.45 2.24 2.184a.75.75 0 01.216.664l-.528 3.084 2.769-1.456a.75.75 0 01.698 0l2.77 1.456-.53-3.084a.75.75 0 01.216-.664l2.24-2.183-3.096-.45a.75.75 0 01-.564-.41L8 2.694v.001z"/></svg>
                <text class="stat bold" x="25" y="12.5">Total Stars Earned:</text>
                <text class="stat bold" x="224.01" y="12.5">${TOTAL_STARS}</text>
              </g>
              <g class="stagger" style="animation-delay: 600ms" transform="translate(0, 25)">
                <svg viewBox="0 0 16 16" width="16" height="16" style="display:block"><path fill="#ffffff" d="M1.643 3.143L.427 1.927A.25.25 0 000 2.104V5.75c0 .138.112.25.25.25h3.646a.25.25 0 00.177-.427L2.715 4.215a6.5 6.5 0 11-1.18 4.458.75.75 0 10-1.493.154 8.001 8.001 0 101.6-5.684zM7.75 4a.75.75 0 01.75.75v2.992l2.028.812a.75.75 0 01-.557 1.392l-2.5-1A.75.75 0 017 8.25v-3.5A.75.75 0 017.75 4z"/></svg>
                <text class="stat bold" x="25" y="12.5">Total Commits (last year):</text>
                <text class="stat bold" x="224.01" y="12.5">${TOTAL_CONTRIBUTIONS}</text>
              </g>
              <g class="stagger" style="animation-delay: 750ms" transform="translate(0, 50)">
                <svg viewBox="0 0 16 16" width="16" height="16" style="display:block"><path fill="#ffffff" d="M7.177 3.073L9.573.677A.25.25 0 0110 .854v4.792a.25.25 0 01-.427.177L7.177 3.427a.25.25 0 010-.354zM3.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm-2.25.75a2.25 2.25 0 113 2.122v5.256a2.251 2.251 0 11-1.5 0V5.372A2.25 2.25 0 011.5 3.25zM11 2.5h-1V4h1a1 1 0 011 1v5.628a2.251 2.251 0 101.5 0V5A2.5 2.5 0 0011 2.5zm1 10.25a.75.75 0 111.5 0 .75.75 0 01-1.5 0zM3.75 12a.75.75 0 100 1.5.75.75 0 000-1.5z"/></svg>
                <text class="stat bold" x="25" y="12.5">Total PRs:</text>
                <text class="stat bold" x="224.01" y="12.5">${TOTAL_PRS}</text>
              </g>
              <g class="stagger" style="animation-delay: 900ms" transform="translate(0, 75)">
                <svg viewBox="0 0 16 16" width="16" height="16" style="display:block"><path fill="#ffffff" d="M8 1.5a6.5 6.5 0 100 13 6.5 6.5 0 000-13zM0 8a8 8 0 1116 0A8 8 0 010 8zm9 3a1 1 0 11-2 0 1 1 0 012 0zm-.25-6.25a.75.75 0 00-1.5 0v3.5a.75.75 0 001.5 0v-3.5z"/></svg>
                <text class="stat bold" x="25" y="12.5">Total Issues:</text>
                <text class="stat bold" x="224.01" y="12.5">${TOTAL_ISSUES}</text>
              </g>
              <g class="stagger" style="animation-delay: 1050ms" transform="translate(0, 100)">
                <svg viewBox="0 0 16 16" width="16" height="16" style="display:block"><path fill="#ffffff" d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z"/></svg>
                <text class="stat bold" x="25" y="12.5">Contributed to (last year):</text>
                <text class="stat bold" x="224.01" y="12.5">${TOTAL_CONTRIBUTIONS}</text>
              </g>
            </g>
          </svg>
          SVGEOF

      - name: Generate top languages card
        env:
          GH_TOKEN: ${{ secrets.STATS_PAT }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          REPOS_JSON=$(gh api graphql -f query='
            query($login: String!) {
              user(login: $login) {
                repositories(ownerAffiliations: OWNER, first: 100, isFork: false) {
                  nodes { name isPrivate isFork }
                }
              }
            }
          ' -f login="$USERNAME" --jq '.data.user.repositories.nodes | map(select(.isFork == false))')

          declare -A LANG_BYTES
          TOTAL_BYTES=0

          for REPO_NAME in $(echo "$REPOS_JSON" | jq -r '.[].name'); do
            LANGS=$(gh api "repos/${USERNAME}/${REPO_NAME}/languages" --jq 'to_entries[] | "\(.key) \(.value)"' 2>/dev/null || true)
            while IFS= read -r LINE; do
              LANG=$(echo "$LINE" | awk '{print $1}')
              BYTES=$(echo "$LINE" | awk '{print $2}')
              if [ -n "$LANG" ] && [ -n "$BYTES" ] && [ "$BYTES" -gt 0 ] 2>/dev/null; then
                LANG_BYTES[$LANG]=$(( ${LANG_BYTES[$LANG]:-0} + BYTES ))
                TOTAL_BYTES=$(( TOTAL_BYTES + BYTES ))
              fi
            done <<< "$LANGS"
          done

          SORTED_LANGS=$(for LANG in "${!LANG_BYTES[@]}"; do
            echo "${LANG_BYTES[$LANG]} $LANG"
          done | sort -rn | head -8)

          get_color() {
            case "$1" in
              JavaScript) echo "#f1e05a" ;;
              TypeScript) echo "#3178c6" ;;
              Java) echo "#b07219" ;;
              Python) echo "#3572A5" ;;
              HTML) echo "#e34c26" ;;
              CSS) echo "#563d7c" ;;
              Shell) echo "#89e051" ;;
              Go) echo "#00ADD8" ;;
              Rust) echo "#dea584" ;;
              PHP) echo "#4F5D95" ;;
              Ruby) echo "#701516" ;;
              C) echo "#555555" ;;
              "C++") echo "#f34b7d" ;;
              "C#") echo "#178600" ;;
              Dart) echo "#00B4AB" ;;
              Kotlin) echo "#A97BFF" ;;
              Swift) echo "#F05138" ;;
              Vue) echo "#41b883" ;;
              *) echo "#8b8b8b" ;;
            esac
          }

          BAR_ITEMS=""
          LANG_ITEMS=""
          X_OFFSET=0
          Y_POS=25

          while IFS=' ' read -r BYTES LANG; do
            PCT=$(echo "scale=2; $BYTES * 100 / $TOTAL_BYTES" | bc)
            WIDTH=$(echo "scale=2; $PCT * 250 / 100" | bc)
            COLOR=$(get_color "$LANG")

            BAR_ITEMS="${BAR_ITEMS}
              <rect mask=\"url(#rect-mask)\" x=\"${X_OFFSET}\" y=\"0\" width=\"${WIDTH}\" height=\"8\" fill=\"${COLOR}\" />"

            LANG_ITEMS="${LANG_ITEMS}
              <g class=\"stagger\" style=\"animation-delay: ${Y_POS}ms\" transform=\"translate(0, ${Y_POS})\">
                <circle cx=\"5\" cy=\"6\" r=\"5\" fill=\"${COLOR}\" />
                <text class=\"lang-name\" x=\"15\" y=\"10\">${LANG} ${PCT}%</text>
              </g>"

            X_OFFSET=$(echo "$X_OFFSET + $WIDTH" | bc)
            Y_POS=$(( Y_POS + 25 ))
          done <<< "$SORTED_LANGS"

          HEIGHT=$(( 90 + Y_POS - 25 ))
          cat > profile/top-langs.svg << SVGEOF
          <svg width="300" height="${HEIGHT}" viewBox="0 0 300 ${HEIGHT}" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="descId">
            <title id="titleId">Most Used Languages</title>
            <style>
              .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #ffffff; animation: fadeInAnimation 0.8s ease-in-out forwards; }
              @supports(-moz-appearance: auto) { .header { font-size: 15.5px; } }
              .lang-name { font: 400 11px "Segoe UI", Ubuntu, Sans-Serif; fill: #ffffff; }
              .stagger { opacity: 0; animation: fadeInAnimation 0.3s ease-in-out forwards; }
              @keyframes fadeInAnimation { from { opacity: 0; } to { opacity: 1; } }
            </style>
            <rect x="0.5" y="0.5" width="299" height="99%" rx="4.5" fill="#0a0a0a" stroke="#e4e2e2"/>
            <g transform="translate(25, 35)">
              <text x="0" y="0" class="header">Most Used Languages</text>
            </g>
            <g transform="translate(25, 55)">
              <mask id="rect-mask">
                <rect x="0" y="0" width="250" height="8" fill="white" rx="5"/>
              </mask>
              ${BAR_ITEMS}
              ${LANG_ITEMS}
            </g>
          </svg>
          SVGEOF

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
