      <circle cx="5" cy="6" r="5" fill="#3572A5" />
      <text class="lang-name" x="15" y="10">Python 3.33%</text>
    </g>
    </g>
    <g transform="translate(150, 75)"><g class="stagger" style="animation-delay: 1500ms">
      <circle cx="5" cy="6" r="5" fill="#8b8b8b" />
      <text class="lang-name" x="15" y="10">Dockerfile .01%</text>
    </g>
    </g>
