<svg width="300" height="190" viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="descId">
  <title id="titleId">Most Used Languages</title>
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #ffffff; animation: fadeInAnimation 0.8s ease-in-out forwards; }
    @supports(-moz-appearance: auto) { .header { font-size: 15.5px; } }
    .lang-name { font: 400 11px "Segoe UI", Ubuntu, Sans-Serif; fill: #ffffff; }
    .stagger { opacity: 0; animation: fadeInAnimation 0.3s ease-in-out forwards; }
    @keyframes fadeInAnimation { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <rect x="0.5" y="0.5" width="299" height="99%" rx="4.5" fill="#0a0a0a" stroke="#e4e2e2"/>
  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Most Used Languages</text>
  </g>
  <g transform="translate(25, 55)">
    <mask id="rect-mask">
      <rect x="0" y="0" width="250" height="8" fill="white" rx="5"/>
    </mask>
    
    <rect mask="url(#rect-mask)" x="0" y="0" width="86.97" height="8" fill="#f1e05a" />
    <rect mask="url(#rect-mask)" x="86.97" y="0" width="55.17" height="8" fill="#e34c26" />
    <rect mask="url(#rect-mask)" x="142.14" y="0" width="38.32" height="8" fill="#563d7c" />
    <rect mask="url(#rect-mask)" x="180.46" y="0" width="23.87" height="8" fill="#b07219" />
    <rect mask="url(#rect-mask)" x="204.33" y="0" width="22.75" height="8" fill="#3178c6" />
    <rect mask="url(#rect-mask)" x="227.08" y="0" width="12.20" height="8" fill="#8b8b8b" />
    <rect mask="url(#rect-mask)" x="239.28" y="0" width="10.60" height="8" fill="#3572A5" />
    <rect mask="url(#rect-mask)" x="249.88" y="0" width=".02" height="8" fill="#8b8b8b" />
  </g>
  <g transform="translate(25, 80)">
    
    <g transform="translate(0, 0)"><g class="stagger" style="animation-delay: 450ms">
      <circle cx="5" cy="6" r="5" fill="#f1e05a" />
      <text class="lang-name" x="15" y="10">JavaScript 34.79%</text>
    </g>
    </g>
    <g transform="translate(0, 25)"><g class="stagger" style="animation-delay: 600ms">
      <circle cx="5" cy="6" r="5" fill="#e34c26" />
      <text class="lang-name" x="15" y="10">HTML 22.07%</text>
    </g>
    </g>
    <g transform="translate(0, 50)"><g class="stagger" style="animation-delay: 750ms">
      <circle cx="5" cy="6" r="5" fill="#563d7c" />
      <text class="lang-name" x="15" y="10">CSS 15.33%</text>
    </g>
    </g>
    <g transform="translate(0, 75)"><g class="stagger" style="animation-delay: 900ms">
      <circle cx="5" cy="6" r="5" fill="#b07219" />
      <text class="lang-name" x="15" y="10">Java 9.55%</text>
    </g>
    </g>
    
    <g transform="translate(150, 0)"><g class="stagger" style="animation-delay: 1050ms">
      <circle cx="5" cy="6" r="5" fill="#3178c6" />
      <text class="lang-name" x="15" y="10">TypeScript 9.10%</text>
